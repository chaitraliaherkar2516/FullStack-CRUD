<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
</head>
<body>

<h2>Edit Product</h2>

<form method="POST">
    {% csrf_token %}

    <label>Product Name:</label>
    <input type="text" name="name" value="{{ product.name }}">
    <br><br>

    <label>Price:</label>
    <input type="number" name="price" value="{{ product.price }}">
    <br><br>

    <button type="submit">Update Product</button>
</form>

</body>
</html>
